<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packliste</title>
<style>
:root {
  --bg:#f4f0e8;
  --card:#fffdf9;
  --line:#e2d8c9;
  --text:#242424;
  --muted:#766b60;
  --green:#7f9b82;
  --green-soft:#edf5ee;
  --shadow:0 14px 35px rgba(70,50,25,.10);
  --manuela:#9b7bd1;
  --loisl:#d71920;
  --gemeinsam:#72c483;
  --kamera:#e8c95a;
  --modellflug:#3478d4;
  --rueckreise:#5f84b8;
  --rueckreise-soft:#eef5fc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.page{max-width:1320px;margin:0 auto;padding:28px}
.header{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 28px;margin-bottom:18px;box-shadow:var(--shadow)}
h1{margin:0;font-size:30px;text-align:center}
.layout{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
.panel,.section{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.panel{padding:20px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.block{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
h2{font-size:18px;margin:0 0 12px}
label{display:flex;gap:10px;align-items:flex-start;margin:9px 0;line-height:1.25}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);margin-top:1px;flex:0 0 auto}
input[type=number]{width:90px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:white}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
button{border:0;border-radius:999px;padding:11px 17px;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:white}
.ghost{background:white;border:1px solid var(--line);color:#2b241a}
.results{display:flex;flex-direction:column;gap:18px}
.person-section{padding:20px}
.person-section.manuela{border-left:10px solid var(--manuela)}
.person-section.loisl{border-left:10px solid var(--loisl)}
.person-section.gemeinsam{border-left:10px solid var(--gemeinsam)}
.person-section.kamera{border-left:10px solid var(--kamera)}
.person-section.modellflug{border-left:10px solid var(--modellflug)}
.person-section.rueckreise{border-left:10px solid var(--rueckreise);background:var(--rueckreise-soft)}
body.rueckreise-mode .header{border-color:#bfd0e5;background:#f5f9fe}
.person-title{font-size:22px;margin:0 0 14px}
.cat-details{border-top:1px solid var(--line);padding:10px 0}
.cat-details:first-of-type{border-top:0}
.cat-summary{cursor:pointer;font-weight:800;font-size:17px;list-style:none}
.cat-summary::-webkit-details-marker{display:none}
.cat-summary::before{content:"▶ ";color:var(--muted)}
.cat-details[open]>.cat-summary::before{content:"▼ "}
.sub-details{margin:8px 0 0 18px;border-top:1px solid #eee5d8;padding-top:6px}
.sub-summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;list-style:none}
.sub-summary::-webkit-details-marker{display:none}
.sub-summary::before{content:"▶ ";color:var(--muted)}
.sub-details[open]>.sub-summary::before{content:"▼ "}
.item{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-top:1px solid #eee5d8;margin-left:18px}
.item:first-of-type{border-top:0}
.empty{padding:18px;color:var(--muted);font-style:italic;text-align:center}
.badge{display:inline-block;border-radius:999px;background:var(--green-soft);border:1px solid #d7e6d9;color:#4f654f;font-size:12px;padding:2px 8px;margin-left:6px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static;max-height:none}}
@media print{body{background:white}.panel,.actions{display:none}.page{padding:0}.section{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="page">
  <div class="header"><h1 id="pageTitle">Packliste – Hinreise</h1></div>
  <div class="layout">
    <aside class="panel">
      <div class="block">
        <h2>Aktivitäten</h2>
        <label><input type="checkbox" id="a_urlaub"> <span>Urlaub</span></label>
        <label><input type="checkbox" id="a_fotografie"> <span>Fotografie</span></label>
        <label><input type="checkbox" id="a_modellflug"> <span>Modellflug</span></label>
        <label><input type="checkbox" id="a_rueckreise"> <span>Rückreise</span></label>
      </div>

      <div class="block">
        <h2>Wer fährt mit?</h2>
        <label><input type="checkbox" id="p_manuela"> <span>Manuela</span></label>
        <label><input type="checkbox" id="p_loisl"> <span>Lois´l</span></label>
        <label><input type="checkbox" id="p_gemeinsam"> <span>Gemeinsam</span></label>
      </div>

      <div class="block">
        <h2>Zeit</h2>
        <label style="align-items:center"><span>Tage</span><input type="number" id="days" value="7" min="1" max="60"></label>
      </div>

      <div class="actions">
        <button class="ghost" onclick="resetChecks()">Haken zurücksetzen</button>
        <button class="ghost" onclick="window.print()">Drucken</button>
      </div>
    </aside>

    <main class="results" id="results">
      <section class="section person-section"><div class="empty">Bitte links Personen und Module auswählen.</div></section>
    </main>
  </div>
</div>

const UI_STATE_IDS = [
  "a_urlaub",
  "a_fotografie",
  "a_modellflug",
  "a_rueckreise",

function readUIState(){
  const state = {};
  UI_STATE_IDS.forEach(id => {
    const el = document.getElementById(id);
    if(el) state[id] = !!el.checked;
  });
  state.days = Number(document.getElementById("days")?.value || 7);
  return state;
}

function applyUIState(state){
  if(!state) return;
  applyingRemoteSync = true;

  UI_STATE_IDS.forEach(id => {
    const el = document.getElementById(id);
    if(el && typeof state[id] === "boolean") el.checked = state[id];
  });

  const days = document.getElementById("days");
  if(days && state.days) days.value = state.days;

  applyingRemoteSync = false;
}

async function saveUIState(){
  if(!syncReady || applyingRemoteSync) return;
  await setDoc(uiStateDoc, {
    ...readUIState(),
    geaendert_am: serverTimestamp()
  }, { merge: true });
}

async function loadUIState(){
  const snap = await getDoc(uiStateDoc);
  if(snap.exists()) applyUIState(snap.data());
}


let syncReady = false;
let applyingRemoteSync = false;

function sanitizeFirestoreId(id){
  return String(id || "")
    .replaceAll("/", "_")
    .replaceAll("\\", "_")
    .replaceAll("#", "_")
    .replaceAll("?", "_");
}

async function saveStatus(itemId){
  if(!syncReady || applyingRemoteSync) return;
  const cleanId = sanitizeFirestoreId(itemId);
  await setDoc(doc(statusCollection, cleanId), {
    id: itemId,
    mitnehmen: checkedItems.has(itemId),
    rueckreise: rueckreiseChecked.has("RUECK-MOD-" + itemId),
    geaendert_am: serverTimestamp()
  }, { merge: true });
}

async function saveRueckreiseStatus(rueckreiseId){
  if(!syncReady || applyingRemoteSync) return;
  const originalId = rueckreiseId.replace("RUECK-MOD-", "");
  await saveStatus(originalId);
}

async function loadInitialStatus(){
  const snap = await getDocs(statusCollection);
  applyingRemoteSync = true;
  checkedItems.clear();
  rueckreiseChecked.clear();

  snap.forEach(d => {
    const data = d.data();
    const id = data.id || d.id;
    if(id === "TEST") return;
    if(data.mitnehmen === true) checkedItems.add(id);
    if(data.rueckreise === true) rueckreiseChecked.add("RUECK-MOD-" + id);
  });

  applyingRemoteSync = false;
  await loadUIState();
  syncReady = true;
  render();
}

function startLiveSync(){
  onSnapshot(statusCollection, snap => {
    if(!syncReady) return;
    applyingRemoteSync = true;

    snap.docChanges().forEach(change => {
      const data = change.doc.data();
      const id = data.id || change.doc.id;
      if(id === "TEST") return;
      if(id === "_ui_state"){
        applyUIState(data);
        return;
      }

      if(change.type === "removed"){
        checkedItems.delete(id);
        rueckreiseChecked.delete("RUECK-MOD-" + id);
        return;
      }

      if(data.mitnehmen === true) checkedItems.add(id);
      else checkedItems.delete(id);

      if(data.rueckreise === true) rueckreiseChecked.add("RUECK-MOD-" + id);
      else rueckreiseChecked.delete("RUECK-MOD-" + id);
    });

    applyingRemoteSync = false;
    render();
  });
}

window.addEventListener("DOMContentLoaded", async () => {
  try{
    await loadInitialStatus();
    startLiveSync();
  }catch(err){
    console.error("Firestore Sync Fehler:", err);
    syncReady = false;
    render();
  }
});

function isModelItem(item){
  return item.category === 'Modellbau' && (item.sub || '').toLowerCase().startsWith('flugmodelle');
}

function isModelSelectRow(item){
  // MASTERREGEL:
  // Nur Datensätze mit ID-Endung -001 sind Modelle.
  return /-001$/.test(item.id || '');
}

function modelName(item){
  if((item.sub || '').includes('/')) return item.sub.split('/').slice(1).join('/').trim();
  return item.name;
}

function normalizeModelKey(s){
  return (s || '').toLowerCase().replace(/\s+/g,' ').trim();
}

function isVirtualMitnehmenModel(item){
  return item.category === 'Modellbau'
    && item.sub === 'Mitnehmen'
    && (item.id || '').startsWith('VIRT-MIT-')
    && item.name !== 'Flugplatzausrüstung';
}

function modelGroupKey(item){
  if(!isModelItem(item)) return "";
  return modelName(item);
}

function selectedModelKeys(){

  for(const item of DB.items){
    if(!isModelItem(item)) continue;

    const key = normalizeModelKey(modelGroupKey(item));
    if(!key) continue;

    const sameGroup = DB.items.filter(x =>
      isModelItem(x) &&
      normalizeModelKey(modelGroupKey(x)) === key
    );

    const hasCheckedItem = sameGroup.some(x => checkedItems.has(x.id));

    if(hasCheckedItem){
      selected.add(modelGroupKey(item));

      const modelRow = sameGroup.find(x => isModelSelectRow(x));
      if(modelRow) selected.add(modelRow.name);
    }
  }

  return Array.from(selected).map(normalizeModelKey);
}

window.toggleItemChecked = async function toggleItemChecked(itemId, checked){
  if(checked) checkedItems.add(itemId);
  else checkedItems.delete(itemId);

  rueckreiseChecked.delete('RUECK-MOD-' + itemId);

  const item = DB.items.find(it => it.id === itemId);

  const isMitnehmen =
    item && (
      (item.category === 'Modellbau' && item.sub === 'Mitnehmen') ||
      (item.category === 'Kamera' && item.sub === 'Mitnehmen')
    );

  // Modell-Auswahl und Mitnehmen-Haken müssen neu rendern,
  // damit Rückreise sofort befüllt/geleert wird.
  if(item && (isModelItem(item) || isMitnehmen)){
    render();
  }

  await saveStatus(itemId);
}

function qtyText(item){
  const days=parseInt(document.getElementById('days').value || '1',10);
  const n=item.name.toLowerCase();
  if(n.includes('unterhose') || n.includes('socke')) return days + ' × ' + displayLabel(item.name);
  if(n.includes('t-shirt')) return (days+1) + ' × ' + displayLabel(item.name);
  return displayLabel(item.name);
}

function includeItem(item, persons){
  const owner = personAliases[item.person] || item.person || 'Gemeinsam';

  if(isVirtualMitnehmenModel(item)){
    if(!document.getElementById('a_modellflug').checked) return false;
    return selectedModelKeys().includes(normalizeModelKey(item.name));
  }

  if(item.category === 'Modellbau') return document.getElementById('a_modellflug').checked;
  if(item.category === 'Kamera') return document.getElementById('a_fotografie').checked;

  // Urlaub ist ein eigener Modus.
  // Dadurch kann man z.B. nur zum Flugplatz fahren, ohne Unterhosen/Zahnbürste/etc. in der Liste zu haben.
  if(item.activity === 'Urlaub') return document.getElementById('a_urlaub').checked && persons.includes(owner);

  return persons.includes(owner);
}

function displaySection(item){
  if(item.category === 'Rückreise') return 'Rückreise';
  if(item.category === 'Modellbau') return 'Modellflug';
  if(item.category === 'Kamera') return 'Kamera';
  return personAliases[item.person] || item.person || 'Gemeinsam';
}

function displayCategory(item){
  if(item.category === 'Rückreise') return 'Rückreise';
  if(isModelItem(item)) return 'Modelle';
  if(item.category === 'Modellbau') return 'Modellbau-Zubehör';
  return item.category || 'Sonstiges';
}

function prettySub(sub){
  const map = {
    'LK prüfen':'Ladekoffer Inhalt',
    'SKM prüfen':'Senderkoffer Manuela Inhalt',
    'SKL prüfen':'Senderkoffer Loisl Inhalt',
    'KIZ prüfen':'Kiste Zubehör Inhalt',
    'WK prüfen':'Werkzeugkasten Inhalt',
    'Flugplatz':'Flugplatzausrüstung',
    'Flugplatzausrüstung':'Flugplatzausrüstung',
    'Mitnehmen':'Mitnehmen'
  };
  return displayLabel(map[sub] || sub);
}

function displaySub(item){
  if(item.category === 'Rückreise') return item.sub || '';
  if(isModelItem(item)) return item.sub || '';
  if(item.category === 'Modellbau') return item.sub || '';
  if(item.category === 'Kamera') return item.sub || '';
  return '';
}

function sortCategories(names){
  return names.sort((a,b)=>{
    const ia=categoryOrder.indexOf(a), ib=categoryOrder.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b,'de');
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });
}

function sortSubs(names, category){
  if(category === 'Kamera'){
    const kameraSubOrder = ['Rucksack','Mitnehmen'];
    return names.sort((a,b)=>{
      const ia=kameraSubOrder.indexOf(a), ib=kameraSubOrder.indexOf(b);
      if(ia===-1 && ib===-1) return a.localeCompare(b,'de');
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    });
  }
  if(category === 'Modelle'){
    return names.sort((a,b)=>{
      const groupRank = s => s.includes('Loisl') ? 0 : s.includes('Manuela') ? 1 : 2;
      const ra = groupRank(a), rb = groupRank(b);
      if(ra !== rb) return ra - rb;
      const ma = a.split('/').pop().trim();
      const mb = b.split('/').pop().trim();
      return ma.localeCompare(mb,'de');
    });
  }
  if(category !== 'Modellbau-Zubehör') return names.sort((a,b)=>a.localeCompare(b,'de'));
  return names.sort((a,b)=>{
    const ia=modellbauSubOrder.indexOf(a), ib=modellbauSubOrder.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b,'de');
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });
}


function buildRueckreiseItems(){
  if(!document.getElementById('a_rueckreise')?.checked) return [];

  const items = [
    'Zimmer kontrolliert',
    'Bad kontrolliert',
    'Schmutzwäsche eingepackt',
    'Kühlschrank kontrolliert',
    'Safe geleert',
    'Nachttische kontrolliert',
    'Steckdosen kontrolliert',
    'Dokumente vorhanden'
  ].map((name, i) => ({
    id: 'RUECK-ALLG-' + i,
    category: 'Rückreise',
    sub: 'Allgemein',
    name,
    person: 'G',
    activity: 'Rückreise',
    required: '',
    always: ''
  }));

  // Rückreise = Spiegelung aller tatsächlich gesetzten Hinreise-Haken.
  // Die ursprüngliche Gliederung bleibt für die Darstellung erhalten.
  DB.items.forEach(it => {
    if(!checkedItems.has(it.id)) return;

    // Kleidung und Schuhe werden bei der Rückreise nicht einzeln geprüft.
    if(it.category === 'Kleidung' || it.category === 'Schuhe') return;

    items.push({
      id: 'RUECK-MOD-' + it.id,
      category: 'Rückreise',
      sub: 'Packliste',
      name: it.name,
      person: it.person,
      activity: 'Rückreise',
      required: it.required,
      always: it.always,
      originalId: it.id,
      returnSection: displaySection(it),
      returnCategory: displayCategory(it),
      returnSub: displaySub(it)
    });
  });

  return items;
}

window.toggleRueckreiseChecked = async function toggleRueckreiseChecked(itemId, checked){
  if(checked) rueckreiseChecked.add(itemId);
  else rueckreiseChecked.delete(itemId);

  if(itemId.startsWith('RUECK-MOD-')){
    const originalId = itemId.replace('RUECK-MOD-','');

    // Bei der Rückreise bestätigt = ursprünglicher Hinreise-Haken wird entfernt.
    if(checked) checkedItems.delete(originalId);

    await saveStatus(originalId);
    render();
  }
}

function renderRueckreise(subs){
  let out = '';
  const allgemein = subs['Allgemein'] || [];
  const packliste = subs['Packliste'] || [];

  out += `<details class="cat-details"><summary class="cat-summary">Allgemein</summary>`;
  for(const it of allgemein){
    const checked = rueckreiseChecked.has(it.id) ? ' checked' : '';
    out += `<label class="item"><input type="checkbox"${checked} onchange="toggleRueckreiseChecked('${it.id.replace(/'/g,"\\'")}', this.checked)"><span>${qtyText(it)}</span></label>`;
  }
  out += `</details>`;

  const grouped = {};
  for(const it of packliste){
    const sec = it.returnSection || 'Gemeinsam';
    const cat = it.returnCategory || 'Sonstiges';
    const sub = it.returnSub || '';
    grouped[sec] ??= {};
    grouped[sec][cat] ??= {};
    grouped[sec][cat][sub] ??= [];
    grouped[sec][cat][sub].push(it);
  }

  const returnSections = sectionOrder
    .filter(name => name !== 'Rückreise' && grouped[name])
    .concat(Object.keys(grouped).filter(name => !sectionOrder.includes(name)));

  for(const sec of returnSections){
    out += `<details class="cat-details"><summary class="cat-summary">${displayLabel(sec)} – Rückreise</summary>`;

    const catNames = sortCategories(Object.keys(grouped[sec]));
    for(const cat of catNames){
      out += `<details class="sub-details"><summary class="sub-summary">${cat}</summary>`;

      const subNames = sortSubs(Object.keys(grouped[sec][cat]), cat);
      for(const sub of subNames){
        if(sub){
          out += `<details class="sub-details"><summary class="sub-summary">${prettySub(sub)}</summary>`;
        }

        for(const it of grouped[sec][cat][sub]){
          const checked = rueckreiseChecked.has(it.id) ? ' checked' : '';
          const badge = it.required === 'Pflicht' ? '<span class="badge">Pflicht</span>' : '';
          out += `<label class="item"><input type="checkbox"${checked} onchange="toggleRueckreiseChecked('${it.id.replace(/'/g,"\\'")}', this.checked)"><span>${qtyText(it)}${badge}</span></label>`;
        }

        if(sub) out += `</details>`;
      }

      out += `</details>`;
    }

    out += `</details>`;
  }

  if(packliste.length === 0){
    out += `<div class="empty">Es sind aktuell keine eingepackten Gegenstände offen.</div>`;
  }

  return out;
}

function groupItems(items){
  const grouped={};
  for(const it of items){
    const sec=displaySection(it);
    const cat=displayCategory(it);
    const sub=displaySub(it);
    grouped[sec] ??= {};
    grouped[sec][cat] ??= {};
    grouped[sec][cat][sub] ??= [];
    grouped[sec][cat][sub].push(it);
  }
  return grouped;
}


function rememberOpenDetails(){
  return Array.from(document.querySelectorAll('#results details[open]'))
    .map(d => {
      const s = d.querySelector('summary');
      return s ? s.textContent.trim() : '';
    })
    .filter(Boolean);
}

function restoreOpenDetails(openTitles){
  if(!openTitles || openTitles.length === 0) return;
  document.querySelectorAll('#results details').forEach(d => {
    const s = d.querySelector('summary');
    if(s && openTitles.includes(s.textContent.trim())) d.open = true;
  });
}

function render(){
  const rueckreiseAktiv = !!document.getElementById('a_rueckreise')?.checked;
  const pageTitle = document.getElementById('pageTitle');
  if(pageTitle) pageTitle.textContent = rueckreiseAktiv ? 'Packliste – Rückreise' : 'Packliste – Hinreise';
  document.body.classList.toggle('rueckreise-mode', rueckreiseAktiv);

  const openDetails = rememberOpenDetails();
  const persons=selectedPersons();
  const filtered = rueckreiseAktiv
    ? buildRueckreiseItems()
    : DB.items.filter(it => includeItem(it, persons));
  const grouped = groupItems(filtered);

  let out='';
  for(const section of sectionOrder){
    const cats=grouped[section] || {};
    const catNames=sortCategories(Object.keys(cats));
    if(catNames.length===0) continue;

    const cls=sectionClass[section] || '';
    out += `<section class="section person-section ${cls}"><h2 class="person-title">${displayLabel(section)}</h2>`;
    for(const cat of catNames){
      const subs = cats[cat];

      if(section === 'Rückreise' && cat === 'Rückreise'){
        out += renderRueckreise(subs);
        continue;
      }

      // Kamera hat keine zusätzliche Kategorie-Zwischenebene.
      // In der Kamera-Karte werden Rucksack und Mitnehmen direkt angezeigt.
      if(section === 'Kamera' && cat === 'Kamera'){
        for(const sub of sortSubs(Object.keys(subs), cat)){
          if(sub){
            out += `<details class="cat-details"><summary class="cat-summary">${prettySub(sub)}</summary>`;
          }
          for(const it of subs[sub]){
            const badge = it.required === 'Pflicht' ? '<span class="badge">Pflicht</span>' : '';
            const checked = checkedItems.has(it.id) ? ' checked' : '';
            out += `<label class="item"><input type="checkbox"${checked} onchange="toggleItemChecked('${it.id.replace(/'/g,"\\'")}', this.checked)"><span>${qtyText(it)}${badge}</span></label>`;
          }
          if(sub) out += `</details>`;
        }
        continue;
      }

      out += `<details class="cat-details"><summary class="cat-summary">${cat}</summary>`;

      if(cat === 'Modelle'){
        const modelSubs = sortSubs(Object.keys(subs), cat);
        const renderOwnerGroup = (title, ownerKey) => {
          const ownerSubs = modelSubs.filter(s => s.includes(ownerKey));
          if(ownerSubs.length === 0) return;
          out += `<details class="sub-details"><summary class="sub-summary">${title}</summary>`;
          for(const sub of ownerSubs){
            const modelTitle = sub.split('/').pop().trim();
            out += `<details class="sub-details"><summary class="sub-summary">${modelTitle}</summary>`;
            for(const it of subs[sub]){
              if(isModelItem(it) && isModelSelectRow(it)) continue;
              const badge = it.required === 'Pflicht' ? '<span class="badge">Pflicht</span>' : '';
              const checked = checkedItems.has(it.id) ? ' checked' : '';
              out += `<label class="item"><input type="checkbox"${checked} onchange="toggleItemChecked('${it.id.replace(/'/g,"\\'")}', this.checked)"><span>${qtyText(it)}${badge}</span></label>`;
            }
            out += `</details>`;
          }
          out += `</details>`;
        };

        renderOwnerGroup('Lois´l', 'Loisl');
        renderOwnerGroup('Manuela', 'Manuela');

        out += `</details>`;
        continue;
      }

      for(const sub of sortSubs(Object.keys(subs), cat)){
        if(sub){
          out += `<details class="sub-details"><summary class="sub-summary">${prettySub(sub)}</summary>`;
        }
        for(const it of subs[sub]){
          // Modell-Startzeile (-001) ist bereits die Aufklapp-Überschrift.
          // Deshalb nicht nochmals als Checkbox darunter anzeigen.
          if(isModelItem(it) && isModelSelectRow(it)) continue;

          const badge = it.required === 'Pflicht' ? '<span class="badge">Pflicht</span>' : '';
          const checked = checkedItems.has(it.id) ? ' checked' : '';
          out += `<label class="item"><input type="checkbox"${checked} onchange="toggleItemChecked('${it.id.replace(/'/g,"\\'")}', this.checked)"><span>${qtyText(it)}${badge}</span></label>`;
        }
        if(sub) out += `</details>`;
      }
      out += `</details>`;
    }
    out += `</section>`;
  }

  if(!out.trim()){
    out='<section class="section person-section"><div class="empty">Bitte links Personen und Module auswählen.</div></section>';
  }
  document.getElementById('results').innerHTML=out;
  restoreOpenDetails(openDetails);
}

async function clearAllFirestoreStatus(){
  if(!syncReady) return;

  const snap = await getDocs(statusCollection);
  const batch = writeBatch(firestoreDb);

  snap.forEach(d => {
    const data = d.data();
    const id = data.id || d.id;

    if(id === "TEST" || id === "_ui_state") return;

    batch.set(d.ref, {
      mitnehmen: false,
      rueckreise: false,
      geaendert_am: serverTimestamp()
    }, { merge: true });
  });

  await batch.commit();
}

window.resetChecks = async function resetChecks(){
  checkedItems.clear();
  selectedModels.clear();
  rueckreiseChecked.clear();

  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  document.getElementById('days').value = 7;

  render();

  await clearAllFirestoreStatus();
  await saveUIState();
}

document.querySelectorAll('input').forEach(el=>el.addEventListener('change', async () => {
  render();
  await saveUIState();
}));
document.getElementById('days')?.addEventListener('change', async () => {
  render();
  await saveUIState();
});
render();
</script>
