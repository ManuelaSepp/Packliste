<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packliste Excelbasiert</title>
<style>
:root {
  --bg:#f4f0e8;
  --card:#fffdf9;
  --line:#e2d8c9;
  --text:#242424;
  --muted:#766b60;
  --green:#7f9b82;
  --green-soft:#edf5ee;
  --shadow:0 14px 35px rgba(70,50,25,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.page{max-width:1320px;margin:0 auto;padding:28px}
.header{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 28px;margin-bottom:18px;box-shadow:var(--shadow)}
h1{margin:0;font-size:30px;text-align:center}
.sub{color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
.panel,.section{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.panel{padding:20px;position:sticky;top:18px}
.block{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 10px}
label{display:flex;gap:10px;align-items:flex-start;margin:9px 0;line-height:1.25}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);margin-top:1px}
input[type=number]{width:90px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:white}
small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.modelbox{display:none;border:1px dashed var(--line);background:#fffaf2;border-radius:16px;padding:12px;margin-top:10px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
button{border:0;border-radius:999px;padding:11px 17px;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:white}
.secondary{background:#e1d4bf;color:#2b241a}
.ghost{background:white;border:1px solid var(--line);color:#2b241a}
.results{display:flex;flex-direction:column;gap:18px}
.person-section{padding:20px}
.person-title{font-size:22px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.category{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.category:first-of-type{border-top:0;margin-top:0;padding-top:0}
.cat-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-bottom:8px}
.count{font-size:12px;color:var(--muted);background:var(--green-soft);border:1px solid #d7e6d9;border-radius:999px;padding:3px 9px}
.item{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-top:1px solid #eee5d8}
.item:first-of-type{border-top:0}
.note{color:var(--muted);font-size:12px;margin-top:2px}
.empty{padding:18px;color:var(--muted);font-style:italic}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{background:var(--green-soft);border:1px solid #d7e6d9;border-radius:999px;padding:7px 12px;font-size:13px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static}}
@media print{body{background:white}.panel,.header button,.actions{display:none}.page{padding:0}.section{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Packliste</h1>
    
    
  </div>

  <div class="layout">
    <aside class="panel">
      <div class="block">
        <h2>👥 Wer fährt mit?</h2>
        <label><input type="checkbox" id="p_manuela" checked> <span>Manuela</span></label>
        <label><input type="checkbox" id="p_loisl" checked> <span>Loisl</span></label>
      </div>

      <div class="block">
        <h2>🗓️ Zeit</h2>
        <label style="align-items:center"><span>Tage</span><input type="number" id="days" value="7" min="1" max="60"></label>
      </div>

      <div class="block">
        <h2>📦 Basis</h2>
        <label><input type="checkbox" id="a_urlaub" checked> <span>Urlaub</span></label>
      </div>

      <div class="block">
        <h2>🚗 Reiseart</h2>
        <label><input type="checkbox" id="a_flugreise"> <span>Flugreise</span></label>
        <label><input type="checkbox" id="a_autoreise" checked> <span>Autoreise</span></label>
      </div>

      <div class="block">
        <h2>🌦️ Saison</h2>
        <label><input type="checkbox" id="a_sommer" checked> <span>Sommer / Sonne</span></label>
      </div>

      <div class="block">
        <h2>🎯 Aktivität</h2>
        <label><input type="checkbox" id="a_fotografie"> <span>Fotografie</span></label>
        <label><input type="checkbox" id="a_modellflug" checked> <span>Modellflug</span></label>

        <div class="modelbox" id="modelbox">

          <label><input type="checkbox" class="model" value="Pitts"> <span>Pitts</span></label>
<label><input type="checkbox" class="model" value="Carbon Cub"> <span>Carbon Cub</span></label>
<label><input type="checkbox" class="model" value="T28"> <span>T28</span></label>
<label><input type="checkbox" class="model" value="Weißer Flieger"> <span>Weißer Flieger</span></label>
<label><input type="checkbox" class="model" value="T-Rex 450"> <span>T-Rex 450</span></label>
<label><input type="checkbox" class="model" value="Extra"> <span>Extra</span></label>
<label><input type="checkbox" class="model" value="Goblin"> <span>Goblin</span></label>
        </div>
      </div>

      <div class="actions">
        <button class="primary" onclick="render()">Packliste neu berechnen</button>
        <button class="ghost" onclick="resetChecks()">Haken zurücksetzen</button>
        <button class="ghost" onclick="window.print()">Drucken</button>
      </div>
    </aside>

    <main class="results" id="results"></main>
  </div>
</div>

T-Rex 450", "name": "T-Rex 450", "note": "noch ohne Detailzubehör"}, {"id": "model_11", "model": "Extra", "name": "Extra", "note": "noch ohne Detailzubehör"}, {"id": "model_12", "model": "Goblin", "name": "Goblin", "note": "noch ohne Detailzubehör"}]};

const personAliases = {
  "M":"Manuela","Manuela":"Manuela",
  "L":"Loisl","Loisl":"Loisl",
  "G":"Gemeinsam","Gemeinsam":"Gemeinsam","Alle":"Gemeinsam","A":"Gemeinsam","":"Gemeinsam"
};

function selectedActivities(){
  const acts = new Set();
  if(document.getElementById('a_urlaub').checked) acts.add('Urlaub');
  if(document.getElementById('a_fotografie').checked) acts.add('Fotografie');
  if(document.getElementById('a_modellflug').checked) acts.add('Modellflug');
  if(document.getElementById('a_flugreise').checked) acts.add('Flugreise');
  if(document.getElementById('a_autoreise').checked) acts.add('Autoreise');
  if(document.getElementById('a_sommer').checked) { acts.add('Sommer / Sonne'); acts.add('Sommer'); }
  return acts;
}

function selectedPersons(){
  const arr = [];
  if(document.getElementById('p_manuela').checked) arr.push('Manuela');
  if(document.getElementById('p_loisl').checked) arr.push('Loisl');
  arr.push('Gemeinsam');
  return arr;
}

function qtyText(name){
  const days = parseInt(document.getElementById('days').value || '1',10);
  const n = name.toLowerCase();
  if(n.includes('unterhose') || n.includes('socke') || n.includes('t-shirt')) return (days+1) + ' × ' + name;
  if(n.includes('zahnbürste') || n.includes('zahnbuerste')) {
    const count = (document.getElementById('p_manuela').checked?1:0)+(document.getElementById('p_loisl').checked?1:0);
    return count > 1 ? count + ' × ' + name : name;
  }
  return name;
}

function includeItem(item, persons, acts){
  let p = personAliases[item.person] || item.person || 'Gemeinsam';
  if(!persons.includes(p)) return false;
  const act = (item.activity || '').trim();
  if(!act) return true;
  if(acts.has(act)) return true;
  if(act.includes('/') && act.split('/').some(a => acts.has(a.trim()))) return true;
  return false;
}

function groupItems(items){
  const grouped = {};
  for(const it of items){
    const p = personAliases[it.person] || it.person || 'Gemeinsam';
    const cat = it.category || 'Sonstiges';
    grouped[p] ??= {};
    grouped[p][cat] ??= [];
    grouped[p][cat].push(it);
  }
  return grouped;
}

function render(){
  const persons = selectedPersons();
  const acts = selectedActivities();

  const modelbox = document.getElementById('modelbox');
  const modellflugAktiv = document.getElementById('a_modellflug').checked;
  modelbox.style.display = modellflugAktiv ? 'block' : 'none';
  if(!modellflugAktiv){
    document.querySelectorAll('.model').forEach(cb => cb.checked = false);
  }

  const chosenModels = Array.from(document.querySelectorAll('.model:checked')).map(x=>x.value);

  const filtered = DB.items.filter(it => includeItem(it, persons, acts));

  for(const m of DB.models){
    if(chosenModels.includes(m.model)){
      filtered.push({
        id:m.id,
        name:m.name,
        category:'Modellflug – ' + m.model,
        person:'Loisl',
        activity:'Modellflug',
        required:'',
        always:'',
        note:m.note || ''
      });
    }
  }

  const grouped = groupItems(filtered);
  const order = ['Manuela','Loisl','Gemeinsam'];
  const icons = {'Manuela':'👩','Loisl':'👨','Gemeinsam':'🤝'};

  let out = '';
  for(const p of order){
    if(!persons.includes(p)) continue;
    const cats = grouped[p] || {};
    const catNames = Object.keys(cats).sort();
    out += `<section class="section person-section"><h2 class="person-title">${icons[p]} ${p}</h2>`;
    if(catNames.length === 0){
      out += `<div class="empty">Keine passenden Einträge für diese Auswahl.</div>`;
    } else {
      for(const cat of catNames){
        const arr = cats[cat];
        out += `<div class="category"><div class="cat-title"><span>${cat}</span></div>`;
        for(const it of arr){
          out += `<label class="item"><input type="checkbox"><span>${qtyText(it.name)}</span></label>`;
        }
        out += `</div>`;
      }
    }
    out += `</section>`;
  }

  document.getElementById('results').innerHTML = out;
  /* summary entfernt */ [
    ...persons.filter(p=>p!=='Gemeinsam'),
    document.getElementById('days').value + ' Tage',
    ...Array.from(acts),
    ...chosenModels
  ].map(x=>`<span class="pill">${x}</span>`).join('');
}

function resetChecks(){
  document.querySelectorAll('#results input[type=checkbox]').forEach(cb => cb.checked=false);
}

document.querySelectorAll('input').forEach(el => el.addEventListener('change', render));
render();
</script>
